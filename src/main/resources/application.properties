spring.application.name=shiori-api

# ===================================================================
# BANCO DE DADOS (12-Factor / Environment Variables com Fallback Local)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiori_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ===================================================================
# MIGRAÇÕES DE BANCO DE DADOS (Flyway)
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ===================================================================
# PADRÃO RFC 9457 (Problem Details)
# ===================================================================
spring.mvc.problemdetails.enabled=true

# ===================================================================
# PORTA DO SERVIDOR (12-Factor Port Binding)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# SEGURANÇA E JWT (12-Factor / Environment Variables)
# ===================================================================
shiori.security.jwt.secret=${JWT_SECRET:${SHIORI_JWT_SECRET:ShioriUltraSecretJwtSigningKeyWithAtLeast256BitsLengthForHmacSha256Security!}}
shiori.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:${SHIORI_JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}}}

# ===================================================================
# ARMAZENAMENTO COMPATÍVEL COM S3 (AWS, R2, MinIO)
# ===================================================================
shiori.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
shiori.storage.s3.access-key=${S3_ACCESS_KEY:sua_access_key}
shiori.storage.s3.secret-key=${S3_SECRET_KEY:sua_secret_key}
shiori.storage.s3.region=${S3_REGION:us-east-1}
shiori.storage.s3.bucket-name=${S3_BUCKET_NAME:shiori-media}

# ===================================================================
# CONFIGURAÇÃO DE UPLOAD MULTIPART
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# ACTUATOR / HEALTHCHECK (Portainer & Docker GitOps)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===================================================================
# ADMIN BOOTSTRAP (12-Factor / Environment Variables)
# ===================================================================
shiori.admin.default-password=${ADMIN_DEFAULT_PASSWORD:}

# ===================================================================
# CORS (Decoupled Front-end & Dynamic Origins)
# ===================================================================
shiori.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}


