spring.datasource.url=jdbc:h2:mem:shiori_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

shiori.storage.s3.endpoint=http://localhost:9000
shiori.storage.s3.access-key=test-access-key
shiori.storage.s3.secret-key=test-secret-key
shiori.storage.s3.region=us-east-1
shiori.storage.s3.bucket-name=shiori-media
